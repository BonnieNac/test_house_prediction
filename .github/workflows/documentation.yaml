name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - "docs/project_documentation/**"
      - ".github/workflows/documentation.yaml"
  pull_request:
    branches: [ main ]
    paths:
      - "docs/project_documentation/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-path: "docs/project_documentation/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.0"

      # The docs have their own pyproject.toml / uv.lock, separate from the root package
      - name: Install dependencies
        working-directory: docs/project_documentation
        run: uv sync --frozen

      - name: Build Sphinx documentation
        working-directory: docs/project_documentation
        run: uv run --frozen sphinx-build -b html . ../../_build/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _build/
          force_orphan: true

