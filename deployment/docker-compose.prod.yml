# Server deployment: images pulled from the registry, nothing is built here.
# Run through ./deploy.sh <staging|prod>, which passes config/<env>.env (settings and image tag).
services:
  api:
    image: "${API_IMAGE:?set API_IMAGE in config/<env>.env}:${API_TAG:-latest}"
    env_file:
      - "${ENV_FILE:?run ./deploy.sh <staging|prod>}"
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
    depends_on:
      mlflow:
        condition: service_started
    networks:
      - test_house_prediction-network

  mlflow:
    image: "ghcr.io/mlflow/mlflow:${MLFLOW_VERSION:?set MLFLOW_VERSION in config/<env>.env}"
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts "localhost:*,127.0.0.1:*,mlflow:*"
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"  # local to the server: reach it through an SSH tunnel
    volumes:
      - mlflow-data:/mlflow
    restart: unless-stopped
    networks:
      - test_house_prediction-network

volumes:
  mlflow-data:

networks:
  test_house_prediction-network:
    driver: bridge
